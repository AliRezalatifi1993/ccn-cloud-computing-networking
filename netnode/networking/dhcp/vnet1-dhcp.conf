strict-order
pid-file=/home/ubuntu/vnet1.pid
except-interface=lo
bind-dynamic
interface=qdhcp-vnet1-tap
dhcp-option=3,192.168.1.1
dhcp-option=6,8.8.8.8
no-resolv
dhcp-range=192.168.1.50,192.168.1.99
dhcp-lease-max=55
dhcp-hostsfile=/home/ubuntu/vnet1.hostsfile
addn-hosts=/home/ubuntu/vnet1.addnhosts
