strict-order
pid-file=/home/ubuntu/vnet2.pid
except-interface=lo
bind-dynamic
interface= qdhcp-vnet2-tap
dhcp-option=3,192.168.2.1
dhcp-option=6,8.8.8.8
no-resolv
dhcp-range=192.168.2.100,192.168.2.154
dhcp-lease-max=55
dhcp-hostsfile=/home/ubuntu/vnet2.hostsfile
addn-hosts=/home/ubuntu/vnet2.addnhosts
